# AppProject for app-of-apps ROOT applications only.
#
# Deliberately separate from the `observability` project. The root app's only
# job is to create Application CRs in the argocd namespace, so that is the only
# thing this project permits — it cannot create a Deployment, a Secret, or a
# ClusterRole even if someone commits one.
#
# The workloads themselves are governed by the project each child Application
# names (`observability`), not by this one. Two projects, two blast radii.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
spec:
  description: App-of-apps roots. May only create Argo CD Applications.

  sourceRepos:
    - https://github.com/BoldFellow/aws-mini-lessons.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd

  # No cluster-scoped resources at all.
  clusterResourceWhitelist: []

  # Only Argo CD's own CRs, nothing else.
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
