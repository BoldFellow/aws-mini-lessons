# AppProject: a security boundary for the observability stack.
# It whitelists exactly which repos may be deployed from, which namespaces
# may be written to, and which cluster-scoped kinds are allowed.
# Best practice: never leave production apps in the built-in `default` project,
# which permits any repo, any cluster, any namespace, any resource kind.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: Cluster observability stack (metrics, logs, dashboards)

  sourceRepos:
    - https://github.com/BoldFellow/aws-mini-lessons.git    # values files (this repo)
    - https://prometheus-community.github.io/helm-charts    # kube-prometheus-stack, CRDs
    - https://grafana-community.github.io/helm-charts       # loki (OSS chart, see apps/loki.yaml)
    - https://grafana.github.io/helm-charts                 # alloy

  destinations:
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: kube-system          # kubelet/cadvisor ServiceMonitors land here

  # CRDs, ClusterRoles, webhook configs and PSP-replacement resources are all
  # cluster-scoped. The operator genuinely needs them, so allow them explicitly
  # rather than granting '*'.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: storage.k8s.io
      kind: StorageClass
    - group: ""
      kind: Namespace
    - group: scheduling.k8s.io
      kind: PriorityClass

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Keep 10 rollback points per app.
  orphanedResources:
    warn: true
