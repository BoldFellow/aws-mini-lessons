# Restricts what these Applications may deploy, and from where. Without a
# project they land in `default`, which allows any repo, any namespace, any
# resource kind — and Argo CD usually runs as cluster-admin.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: Cluster observability stack

  sourceRepos:
    - https://github.com/BoldFellow/aws-mini-lessons.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: kube-system      # kubelet ServiceMonitor lands here

  # The operator needs these. Anything not listed is rejected.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: ""
      kind: Namespace
    # Created by the prod overlay's extraManifests.
    - group: scheduling.k8s.io
      kind: PriorityClass

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Flags resources sitting in these namespaces that no Application claims —
  # usually leftovers from a manual kubectl apply. Warn only, never deletes.
  orphanedResources:
    warn: true
    ignore:
      # Created by the StatefulSet controller, not tracked by Argo CD.
      - group: ""
        kind: PersistentVolumeClaim
      - group: ""
        kind: Endpoints
      - group: discovery.k8s.io
        kind: EndpointSlice
