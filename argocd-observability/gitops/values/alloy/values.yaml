# Grafana Alloy 1.12.1 — reads pod logs on each node, pushes them to Loki.

controller:
  type: daemonset
  tolerations:
    - effect: NoSchedule
      operator: Exists

alloy:
  mounts:
    varlog: true          # required; without it the pipeline collects nothing
    # dockercontainers stays false: EKS runs containerd, so that path does not
    # exist, and /var/log/pods is already covered by varlog.

  # Not set by the chart; the config below needs it.
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {memory: 512Mi}

  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Only pods on THIS node. Filtering server-side keeps every collector
      // from listing the whole cluster.
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // Keep the label set small and bounded. Every distinct combination of
      // label values is a separate stream in Loki; high-cardinality labels
      // (trace id, request id) belong in the log line, not here.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }

        // kubelet writes /var/log/pods/<ns>_<pod>_<uid>/<container>/N.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      // Strips the containerd CRI wrapper so the stored line is the app's own.
      loki.process "pod_logs" {
        stage.cri {}

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }

        // Buffers to disk when Loki is unreachable. Without it, loki.write
        // retries in memory and eventually drops — a Loki restart costs logs.
        // NOTE: marked EXPERIMENTAL upstream, and the buffer lives in the
        // pod's storage path, so it survives a Loki outage, not an Alloy
        // pod restart. Give the DaemonSet a hostPath if you need that too.
        wal {
          enabled         = true
          max_segment_age = "1h"
          drain_timeout   = "30s"
        }

        external_labels = {
          cluster = "eks-demo",
        }
      }

serviceMonitor:
  enabled: true
