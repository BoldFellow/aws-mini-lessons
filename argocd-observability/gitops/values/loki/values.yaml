# Loki 18.12.1 (grafana-community), Monolithic mode on S3.
#
# Modes: Monolithic (tens of GB/day) · SimpleScalable (~1TB/day, removed in
# Loki 4) · Distributed (>1TB/day). The latter two require object storage;
# use it here anyway so chunks survive the pod moving.
deploymentMode: Monolithic

loki:
  auth_enabled: false          # single tenant

  commonConfig:
    replication_factor: 1

  # MANDATORY — the chart ships an empty schemaConfig on purpose. Never edit an
  # existing entry; append a new one with a future `from` date.
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: {prefix: index_, period: 24h}

  storage:
    type: s3
    bucketNames:
      chunks: CHANGEME-loki-chunks     # see lesson.md step 3
      ruler: CHANGEME-loki-ruler
    s3:
      region: eu-central-1
      # No keys on purpose — EKS Pod Identity supplies credentials.

  limits_config:
    retention_period: 744h       # 31 days
    volume_enabled: true         # Grafana's log-volume histogram

  # retention_period above does NOTHING without this. Otherwise the S3 bill
  # grows forever while Grafana quietly hides the old data.
  compactor:
    retention_enabled: true
    delete_request_store: s3

  analytics:
    reporting_enabled: false

# Pod Identity binds the IAM role from the AWS side — no role-arn annotation
# here (that would be IRSA). The association keys on namespace + this name.
serviceAccount:
  create: true
  name: loki

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi          # WAL + index cache; chunks live in S3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits:   {memory: 2Gi}

# nginx in front of Loki. Only useful in SimpleScalable/Distributed, where read
# and write are separate pods needing one address. With one pod it is a wasted
# hop, so clients talk to the `loki` Service on :3100 directly.
gateway:
  enabled: false

# These memcached caches default to ON and request several GB each — correct at
# scale, but on a small cluster they simply never schedule.
chunksCache: {enabled: false}
resultsCache: {enabled: false}

monitoring:
  serviceMonitor:
    enabled: true

lokiCanary: {enabled: false}
test: {enabled: false}
