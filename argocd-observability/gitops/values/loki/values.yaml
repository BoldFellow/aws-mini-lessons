# Loki 18.12.1 (grafana-community), Monolithic mode on local disk.
#
# Modes: Monolithic (tens of GB/day) · SimpleScalable (~1TB/day, removed in
# Loki 4) · Distributed (>1TB/day). The latter two REQUIRE object storage;
# Monolithic does not, which is what makes this POC simple.
deploymentMode: Monolithic

loki:
  auth_enabled: false          # single tenant

  commonConfig:
    replication_factor: 1

  # MANDATORY — the chart ships an empty schemaConfig on purpose. Never edit an
  # existing entry; append a new one with a future `from` date.
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}

  # POC: chunks live on the PVC below. No buckets, no IAM, works on any cluster.
  # Losing the PVC loses the logs, so switch to S3 before anyone depends on
  # this — see "Moving to S3" in lesson.md. That is a values change, not a
  # migration, which is why Monolithic mode is the right place to start.
  storage:
    type: filesystem

  limits_config:
    retention_period: 744h       # 31 days
    volume_enabled: true         # Grafana's log-volume histogram
    # Per-log key/value pairs stored outside the label set — high-cardinality
    # data (trace id, user id) without creating a stream per value. Needs
    # schema v13, which is set above.
    allow_structured_metadata: true

  # Off by default. Powers automatic pattern detection in Grafana's Explore
  # Logs — grouping "same message, different id" without writing the regex.
  pattern_ingester:
    enabled: true

  # Lets Grafana manage Loki alert rules through its UI/API.
  rulerConfig:
    enable_api: true

  # retention_period above does NOTHING without this — Grafana would hide old
  # data while the disk kept filling until Loki stopped ingesting.
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3   # any RWO class; drop this line to use the cluster default
    size: 50Gi          # holds the chunks too, until you move to S3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits:   {memory: 2Gi}

# nginx in front of Loki. Only useful in SimpleScalable/Distributed, where read
# and write are separate pods needing one address. With one pod it is a wasted
# hop, so clients talk to the `loki` Service on :3100 directly.
gateway:
  enabled: false

# These memcached caches default to ON and request several GB each — correct at
# scale, but on a small cluster they simply never schedule.
chunksCache: {enabled: false}
resultsCache: {enabled: false}

# Loki's HTTP API is unauthenticated — auth_enabled only controls whether it
# REQUIRES a tenant header, not whether it verifies anyone. Without this, any
# pod in the cluster can push forged logs or read everyone's. Restrict ingress
# to the namespace where Alloy (push) and Grafana (query) live.
networkPolicy:
  enabled: true
  ingress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: observability
  metrics:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: observability
  externalStorage:
    ports: [443]        # egress to S3 once you move off filesystem

monitoring:
  serviceMonitor:
    enabled: true

lokiCanary: {enabled: false}
test: {enabled: false}
