# kube-prometheus-stack 90.0.0 on Amazon EKS.

# CRDs are owned by the prometheus-operator-crds Application (sync-wave -2).
crds:
  enabled: false

## EKS runs a managed control plane — these four components are not scrapeable.
## Leaving them on gives you four permanently-firing alerts on day one.
kubeControllerManager: {enabled: false}
kubeScheduler:         {enabled: false}
kubeEtcd:              {enabled: false}
kubeProxy:             {enabled: false}   # needs metricsBindAddress 0.0.0.0 to work

kubelet:
  enabled: true
  namespace: kube-system

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 40GB          # keep under the PVC size

    # Without these, Prometheus only discovers ServiceMonitors carrying this
    # release's Helm labels — Loki's and Alloy's would be invisible.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    externalLabels:
      cluster: eks-demo

    resources:
      requests: {cpu: 500m, memory: 2Gi}
      limits:   {memory: 4Gi}

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 50Gi}

alertmanager:
  # Note: no receivers configured, so alerts currently go nowhere.
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 10Gi}

grafana:
  # Create out of band — never commit a password:
  #   kubectl -n observability create secret generic grafana-admin \
  #     --from-literal=admin-user=admin \
  #     --from-literal=admin-password="$(openssl rand -base64 24)"
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

  # Gateway is disabled in the Loki values, so talk to Loki directly.
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100

  # Pick up dashboards from any ConfigMap labelled grafana_dashboard: "1".
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL

  grafana.ini:
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false

  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {memory: 512Mi}

prometheus-node-exporter:
  tolerations:
    - effect: NoSchedule
      operator: Exists
