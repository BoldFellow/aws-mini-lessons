# Production overlay for kube-prometheus-stack.
#
# NOT loaded by the Application in apps/10-kube-prometheus-stack.yaml, which
# loads values.yaml + values-dev.yaml. Point a SECOND Application at
# values.yaml + this file to deploy a production instance.
#
# Everything here depends on a fact this repo cannot know: your hostname, your
# identity provider, your certificate. That is exactly why it is not in the base
# file — a plausible-looking placeholder that ships is worse than an absent one.

grafana:
  grafana.ini:
    server:
      # REQUIRED. Must be the URL users actually type. Grafana builds absolute
      # redirects, alert links and rendered-image URLs from this; wrong value =
      # login redirects to a host that does not resolve.
      root_url: https://grafana.CHANGEME.example.com

    security:
      # Both of these REQUIRE that the URL above is really HTTPS. Enabling them
      # on a plain-HTTP endpoint silently breaks the session cookie.
      cookie_secure: true
      strict_transport_security: true

    analytics:
      reporting_enabled: false
      check_for_updates: false

    # --- SSO -----------------------------------------------------------------
    # Uncomment and fill in for your IdP. The client secret must NOT appear
    # here: reference it from a Secret via the envs below instead.
    # auth.generic_oauth:
    #   enabled: true
    #   name: CHANGEME-IdP
    #   allow_sign_up: true
    #   auto_login: false
    #   client_id: CHANGEME
    #   scopes: "openid email profile groups"
    #   auth_url: https://idp.example.com/oauth2/authorize
    #   token_url: https://idp.example.com/oauth2/token
    #   api_url: https://idp.example.com/oauth2/userinfo
    #   # Map IdP groups to Grafana roles. Without this everyone lands as the
    #   # auto_assign_org_role from the base values (Viewer).
    #   role_attribute_path: >-
    #     contains(groups[*], 'platform-admins') && 'Admin'
    #     || contains(groups[*], 'developers') && 'Editor'
    #     || 'Viewer'
    #   role_attribute_strict: true

    auth.basic:
      # Turn this off ONLY once SSO above is verified working. Until then the
      # admin password is your only way in. Leaving both on permanently means
      # the shared password stays a valid bypass of your IdP.
      enabled: true

  # Injects GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from a Secret, so the secret
  # never enters this file or the rendered manifest.
  # envFromSecret: grafana-oauth

  replicas: 2

  # Real access, instead of kubectl port-forward. Assumes AWS Load Balancer
  # Controller and an ACM certificate; adjust for your ingress controller.
  # The host here MUST match grafana.ini server.root_url above.
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internal        # not internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:CHANGEME:certificate/CHANGEME
    hosts:
      - grafana.CHANGEME.example.com
    tls:
      - hosts: [grafana.CHANGEME.example.com]

# A PriorityClass the stack's own pods use. The built-in
# system-cluster-critical cannot be used outside kube-system — the PodPriority
# admission controller rejects it — so define our own just below the built-ins.
# Without this, monitoring is among the first things evicted under node
# pressure, which is exactly when you need it.
extraManifests:
  - apiVersion: scheduling.k8s.io/v1
    kind: PriorityClass
    metadata:
      name: observability-critical
    value: 1000000000
    globalDefault: false
    preemptionPolicy: PreemptLowerPriority
    description: "Observability stack. Evict application workloads first."

# kube-prometheus-stack alerts on Kubernetes. Nothing in it alerts on the
# LOGGING pipeline, so a silent Loki or a stalled Alloy looks like "quiet
# logs" rather than an outage. These close that gap.
additionalPrometheusRulesMap:
  observability-self:
    groups:
      - name: observability.pipeline
        rules:
          - alert: LokiDown
            expr: sum(up{job=~".*loki.*"}) == 0
            for: 10m
            labels: {severity: critical}
            annotations:
              summary: "Loki is not reachable — no logs are being stored"

          - alert: LokiRequestErrors
            expr: |
              100 * sum by (route) (rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m]))
                  / sum by (route) (rate(loki_request_duration_seconds_count[5m])) > 5
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "Loki {{ $labels.route }} is returning >5% 5xx"

          - alert: AlloyDroppingLogs
            expr: sum(rate(loki_write_dropped_bytes_total[5m])) > 0
            for: 10m
            labels: {severity: critical}
            annotations:
              summary: "Alloy is dropping log bytes — ingest is failing, logs are lost"

          - alert: AlloyNotRunningOnEveryNode
            # A node with no collector produces no logs, silently.
            expr: |
              kube_daemonset_status_desired_number_scheduled{daemonset="alloy"}
                - kube_daemonset_status_number_ready{daemonset="alloy"} > 0
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "Alloy is not ready on every node — those nodes ship no logs"

          - alert: PrometheusRemoteWriteBehind
            expr: |
              (prometheus_remote_storage_highest_timestamp_in_seconds
                - ignoring(remote_name, url) group_right
                  prometheus_remote_storage_queue_highest_sent_timestamp_seconds) > 300
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "Remote write is >5m behind — long-term metrics are lagging"

prometheus:
  # A node drain can otherwise take every replica at once.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow

  prometheusSpec:
    priorityClassName: observability-critical

    # Spread replicas across AZs. ScheduleAnyway, not DoNotSchedule: a
    # single-AZ cluster should still schedule rather than hang Pending.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus

    # Local retention is a cache; the durable copy lives in Amazon Managed
    # Prometheus. 30d local keeps dashboards fast without querying remote.
    remoteWrite:
      - url: https://aps-workspaces.eu-central-1.amazonaws.com/workspaces/CHANGEME-WORKSPACE-ID/api/v1/remote_write
        sigv4:
          region: eu-central-1        # credentials via Pod Identity
        queueConfig:
          capacity: 10000
          maxSamplesPerSend: 2000
          maxShards: 200
        writeRelabelConfigs:
          # Do not pay to ship every series. Keep what dashboards and alerts
          # actually read; drop the long tail.
          - sourceLabels: [__name__]
            regex: 'go_.*|process_.*|promhttp_.*'
            action: drop

    retention: 30d
    retentionSize: 180GB
    externalLabels:
      cluster: CHANGEME-prod
    replicas: 2                 # survives a node drain
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        memory: 12Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 200Gi

alertmanager:
  podDisruptionBudget:
    enabled: true
    minAvailable: 2             # gossip needs a quorum to dedupe correctly

  alertmanagerSpec:
    replicas: 3                 # gossip cluster; 3 is the smallest sane size
    priorityClassName: observability-critical
    # Mounts secret/alertmanager-receivers at /etc/alertmanager/secrets/... so
    # the routing key below is read from a file, never written into git.
    #   kubectl -n observability create secret generic alertmanager-receivers \
    #     --from-literal=pagerduty-key=<key>
    secrets:
      - alertmanager-receivers

  # THE most important thing on this page. Without a route and a receiver
  # every alert lands in the chart's default null receiver: monitoring that
  # cannot page anyone. Fix this before writing a single custom alert rule.
  config:
    route:
      receiver: platform-oncall
      group_by: ['alertname', 'cluster', 'namespace']
      group_wait: 30s           # let a burst coalesce into one page
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog fires constantly by design — it is how you prove the whole
        # alerting path still works. Route it to a deadman's-switch service,
        # never to a human.
        - matchers: [alertname = "Watchdog"]
          receiver: "null"
          repeat_interval: 5m
        - matchers: [severity = "critical"]
          receiver: platform-oncall
        - matchers: [severity =~ "warning|info"]
          receiver: platform-slack

    receivers:
      - name: "null"
      - name: platform-oncall
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-receivers/pagerduty-key
            send_resolved: true
      - name: platform-slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack-webhook
            channel: '#platform-alerts'
            send_resolved: true

    inhibit_rules:
      # A critical alert already paged someone; do not also send the warning.
      - source_matchers: [severity = "critical"]
        target_matchers: [severity = "warning"]
        equal: ['alertname', 'namespace']
