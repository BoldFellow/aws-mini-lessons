# Environment overlay, layered on top of values.yaml by the Application's
# valueFiles list (later files win).
#
# The Application sets `ignoreMissingValueFiles: true`, so you can delete this
# file — or add values-prod.yaml and point a second Application at it — without
# breaking the render. That is the default/override pattern: one base file,
# one thin per-environment file, no forked charts.
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 8GB
    externalLabels:
      cluster: eks-dev
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  persistence:
    size: 2Gi
