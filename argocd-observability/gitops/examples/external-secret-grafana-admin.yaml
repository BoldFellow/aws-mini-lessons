# EXAMPLE — not deployed by any Application in this repo.
#
# Replaces the manual `kubectl create secret generic grafana-admin` in
# lesson.md step 4. Requires External Secrets Operator installed and a
# ClusterSecretStore backed by AWS Secrets Manager (its controller needs its own
# Pod Identity association granting secretsmanager:GetSecretValue).
#
# Why this rather than the kubectl command: the manual secret exists because
# somebody ran something once. It is not in git, not reproducible, and nothing
# rotates it. This manifest is in git while the VALUE never is — ESO reads it
# from Secrets Manager at sync time and refreshes it on the interval below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h          # picks up a rotation without a redeploy
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin        # must match grafana.admin.existingSecret
    creationPolicy: Owner
  data:
    - secretKey: admin-user    # must match grafana.admin.userKey
      remoteRef:
        key: prod/observability/grafana
        property: username
    - secretKey: admin-password
      remoteRef:
        key: prod/observability/grafana
        property: password
