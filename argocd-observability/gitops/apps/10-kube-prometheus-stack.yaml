apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  # Multi-source: the chart comes from the upstream Helm repo, the values come
  # from THIS git repo. The second source carries `ref: values`, which makes
  # `$values` resolve to that repo's root.
  #
  # NOTE: a source with `ref` set must NOT also set `chart`, and `$values` may
  # only appear at the START of a valueFiles path.
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 90.0.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/argocd-observability/gitops/values/kube-prometheus-stack/values.yaml
          - $values/argocd-observability/gitops/values/kube-prometheus-stack/values-dev.yaml
        # Lets the dev/prod overlay above be absent without failing the render.
        ignoreMissingValueFiles: true

    - repoURL: https://github.com/BoldFellow/aws-mini-lessons.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true          # large admission-webhook + CRD objects
      - RespectIgnoreDifferences=true # keep SSA from fighting ignoreDifferences
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  # The operator injects its own CA bundle into these webhooks at runtime.
  # Without this, the app oscillates between Synced and OutOfSync forever.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: kube-prometheus-stack-admission
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: kube-prometheus-stack-admission
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    # Grafana's dashboard sidecar rewrites this at runtime.
    - group: apps
      kind: Deployment
      name: kube-prometheus-stack-grafana
      jqPathExpressions:
        - .spec.template.spec.containers[]?.resources

  revisionHistoryLimit: 10
