# Prometheus Operator CRDs, split out of kube-prometheus-stack into their own
# Application. Two reasons this is the recommended layout:
#
#  1. Helm does not upgrade CRDs that live in a chart's crds/ directory. Owning
#     them in a separate chart makes CRD upgrades an ordinary Argo CD sync.
#  2. These CRDs are enormous (the Prometheus CRD alone is >1 MB). Client-side
#     apply stores a full copy in the last-applied-configuration annotation and
#     blows the 262144-byte annotation limit. ServerSideApply=true avoids that.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 31.0.1
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: false          # never auto-prune CRDs: it deletes every CR with them
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  revisionHistoryLimit: 5
