# Grafana Alloy — the log shipper that feeds Loki.
#
# Promtail reached end-of-life on 2 March 2026. Alloy (Grafana's OpenTelemetry
# Collector distribution) is its replacement and the only supported path for new
# clusters. `alloy convert` will translate an existing promtail config.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after Loki: it pushes to loki-gateway
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/argocd-observability/gitops/values/alloy/values.yaml
          - $values/argocd-observability/gitops/values/alloy/values-dev.yaml
        ignoreMissingValueFiles: true

    - repoURL: https://github.com/BoldFellow/aws-mini-lessons.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10
