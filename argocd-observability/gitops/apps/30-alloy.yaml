# Loki does not collect logs — it only accepts pushes. Alloy is the agent that
# reads /var/log/pods on each node and pushes. Promtail, its predecessor,
# reached end-of-life on 2 March 2026.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after Loki: it pushes to it
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/argocd-observability/gitops/values/alloy/values.yaml
          - $values/argocd-observability/gitops/values/alloy/values-dev.yaml
        # Lets the overlay be absent (or swapped for values-prod.yaml
        # in a second Application) without failing the render.
        ignoreMissingValueFiles: true

    - repoURL: https://github.com/BoldFellow/aws-mini-lessons.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
