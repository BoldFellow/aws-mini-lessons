# The OSS Loki chart moved to grafana-community/helm-charts in March 2026
# (forked at 6.55.0, hence the 18.x numbering). The `loki` chart still at
# grafana.github.io is now Grafana Enterprise Logs. `loki-stack` is deprecated
# and ships an EOL Promtail.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after kps, which defines ServiceMonitor
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 18.12.1
      helm:
        releaseName: loki
        valueFiles:
          - $values/argocd-observability/gitops/values/loki/values.yaml
          - $values/argocd-observability/gitops/values/loki/values-dev.yaml
        # Lets the overlay be absent (or swapped for values-prod.yaml
        # in a second Application) without failing the render.
        ignoreMissingValueFiles: true

    - repoURL: https://github.com/BoldFellow/aws-mini-lessons.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}

  # The API server stamps these onto volumeClaimTemplates. Ignoring the whole
  # block instead would also hide a real storage-size change.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.metadata.creationTimestamp
        - .spec.volumeClaimTemplates[]?.status
