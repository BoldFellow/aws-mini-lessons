# App-of-apps root. The only manifest you apply by hand:
#   kubectl apply -f projects/observability.yaml
#   kubectl apply -f bootstrap/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-root
  namespace: argocd
  finalizers:
    # Deleting this app also deletes the whole stack.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/BoldFellow/aws-mini-lessons.git
    targetRevision: main
    path: argocd-observability/gitops/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
